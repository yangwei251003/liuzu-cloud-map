name: Web release gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: liuzu_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liuzu_release_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/liuzu_release_test
      DATABASE_SSL_MODE: disable
      ALLOW_DATABASE_INTEGRATION_TESTS: "1"
      DATABASE_TEST_CONFIRM_DISPOSABLE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gate
        run: npm run verify:release

      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-release-gate-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
